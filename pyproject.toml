[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "environmental-growth-analysis"
version = "0.1.0"
description = "A reproducible fixed-effects study of economic growth and CO2 emissions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "linearmodels>=7.0,<8",
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[project.scripts]
environmental-growth = "environmental_growth.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/environmental_growth"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
